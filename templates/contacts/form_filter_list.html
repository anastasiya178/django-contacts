{% block form_filter %}
    <div class="input-group">
        <form method="get">
            {% for field in filter.form %}
                <div class="form-group">
                    {{ field.errors }}
                    {{ field.label_tag }} {{ field }}
                    <button type="submit" class="btn btn-outline-primary">Search</button>
                </div>
            {% endfor %}
        </form>
    </div>
{% endblock %}
